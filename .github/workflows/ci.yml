name: ci

# Push only, deliberately. Checks are recorded against a commit, not an event,
# so a PR picks up the run its head commit already got here -- adding a
# pull_request trigger would put two check runs with the same name on one SHA,
# and branch protection reads whichever it likes. No branch filter, so a PR
# from any branch arrives with its checks already green.
# Trade-off: PRs from forks get no CI, since their commits never land here.
on:
  push:

# Superseded pushes to the same branch stop building. Safe here because each
# push is its own SHA, so a cancelled run can never taint a later commit's
# checks. main is exempt -- its runs back the required status checks.
concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# CI only ever reads the tree. Set explicitly so a change to the repo-wide
# default workflow permissions can't silently hand this a writable token.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Formatting is settled by rustfmt.toml (which matches the style the
      # code was already written in), so this stays a cheap gate rather
      # than a source of churn. Ubuntu only — formatting is not
      # platform-dependent and there is no reason to pay for it 3x.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - run: cargo clippy --all-targets --locked -- -D warnings

      # Default (parallel) threads: the chdir-ing tests now serialize on a
      # shared lock in platform::in_scratch_dir rather than relying on CI
      # passing --test-threads=1, so this runs the same way it does locally.
      - run: cargo test --locked

      # tests/scaffold_and_build.rs: actually scaffolds *and builds* a real
      # project for every language/template combination via the compiled
      # cforge binary. The unit tests above never invoke cmake or a real
      # compiler, so without this, a template that no longer compiles would
      # still go green. #[ignore]'d in the test file (slow, needs a real
      # toolchain) — run explicitly here instead. This is also what
      # actually exercises the Windows (Winsock/clang-via-winget) code
      # paths, which nothing else in CI touches. The Objective-C cases are
      # macOS-only, matching where the language is supported.
      - run: cargo test --locked --test scaffold_and_build -- --ignored --test-threads=1

  # Two gates nothing above covers. Both are cheap and Ubuntu-only: neither
  # is platform-dependent, so paying for them 3x in the matrix buys nothing.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Known CVEs in the dependency tree (RustSec advisory DB). cforge is
      # installed via `curl | sh` and replaces its own binary on update, so
      # a vulnerable dependency is a supply-chain problem for every user,
      # not just a build-time annoyance.
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  msrv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Pinned to the rust-version in Cargo.toml. Without this, the floor is
      # a claim in a manifest that nothing ever tests — it drifts upward the
      # first time anyone uses a newer std API, and users on an older
      # toolchain find out instead of CI.
      - uses: dtolnay/rust-toolchain@1.120.0

      - run: cargo check --all-targets --locked

  # install.sh/uninstall.sh are the curl-pipe-to-shell surface and were the
  # only executable code in the repo with no check at all. shellcheck ships
  # on the Ubuntu runner; PSScriptAnalyzer runs on Windows for the
  # PowerShell halves.
  scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # --severity=warning: the remaining info-level notes are deliberate
      # (SC2016 fires on the single-quoted PATH line, which must be written
      # to the rc file literally rather than expanded at install time).
      # install.sh is documented as 'curl ... | sh', so its shebang is
      # bypassed and it must be POSIX-clean, not merely bash-clean — hence
      # the explicit '-s sh' dialect for it. uninstall.sh runs via its own
      # shebang and may use bash features.
      - run: shellcheck -s sh --severity=warning install.sh
      - run: shellcheck --severity=warning uninstall.sh

  scripts-powershell:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          # PSAvoidUsingWriteHost is excluded on purpose: these are
          # interactive installers whose entire job is printing progress to
          # a human at a console. Write-Output would put that text on the
          # pipeline instead, which is the thing to avoid here.
          $issues = Invoke-ScriptAnalyzer -Path . -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          if ($issues) { $issues | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host "PSScriptAnalyzer: no errors or warnings"

      # Actually runs install.ps1 against the real, live repo -- not just
      # lint. Static analysis alone would never have caught a wrong tag or
      # a working-on-my-mental-model-but-not-on-real-Windows redirect
      # resolution, since neither of us can run PowerShell locally.
      # cforge.exe ending up on disk and reporting the right version is the
      # only thing that actually proves the install flow still works.
      #
      # Skipped on a tag push specifically: a v*.*.* tag also triggers
      # release.yml, and this step installs whatever release is *currently*
      # published -- on the exact tag just pushed, that races release.yml's
      # own publish job (confirmed: publish finished at 13:15:08, this step
      # had already failed to find a release at 13:13:47). The commit was
      # already green from its branch push moments earlier; skipping here
      # avoids re-testing it against a release that may not exist yet,
      # without touching the workflow's own trigger.
      - if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          .\install.ps1
          $exe = Join-Path $HOME ".local\bin\cforge.exe"
          if (-not (Test-Path $exe)) { throw "install.ps1 ran but $exe does not exist" }
          & $exe --version
