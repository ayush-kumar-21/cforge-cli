name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Gate. A tag push runs this workflow directly, so without it a release
  # can be published from a commit that never went green — and, more likely,
  # from a tag whose version disagrees with Cargo.toml, which ships a binary
  # whose own `--version` is wrong.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi

      # Accepts either an exact '## <version>' heading (a version folded
      # into its own section) or a live '## Unreleased' section -- an
      # interim pre-release like this one, cut before the version it
      # belongs to is finalized, doesn't warrant renaming it yet. Either
      # way, the point is a release never ships with nothing describing
      # what's in it.
      - name: Changelog has an entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if grep -q "^## $version" CHANGELOG.md; then
            exit 0
          fi
          if grep -q "^## Unreleased" CHANGELOG.md; then
            exit 0
          fi
          echo "::error::CHANGELOG.md has no '## $version' section and no '## Unreleased' section"
          exit 1

      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: cforge-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: cforge-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: cforge-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: cforge-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/cforge ${{ matrix.asset }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\cforge.exe ${{ matrix.asset }}

      # `cforge self-update` fetches <asset>.sha256 next to the binary and
      # refuses to install anything that doesn't match it. One file per
      # asset rather than a single aggregate SHA256SUMS: these matrix jobs
      # run in parallel on different runners, so an aggregate would need a
      # join job to assemble, for no benefit to the one consumer.
      #
      # Only the bare hex digest is written — no filename column. The
      # updater compares the whole trimmed file, and the two platforms'
      # tools disagree on the second column's format.
      - name: Checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.asset }} | cut -d' ' -f1 > ${{ matrix.asset }}.sha256

      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Get-FileHash -Algorithm SHA256 '${{ matrix.asset }}').Hash.ToLower() |
            Out-File -NoNewline -Encoding ascii '${{ matrix.asset }}.sha256'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  # Publishing happens exactly once, here. When each matrix job called
  # action-gh-release itself, two of them raced: both saw no existing
  # release for the tag and both created one, leaving an empty draft
  # alongside the real release every time.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -l dist

      # semver's own convention: a 0.x version is still unstable, so mark it
      # as a GitHub pre-release rather than "Latest" — matches SECURITY.md's
      # "cforge is pre-1.0 and moves fast". Flips to a real release on its
      # own the day Cargo.toml crosses 1.0.0, with no workflow edit needed.
      - name: Determine prerelease status from the tag's major version
        id: prerelease
        run: |
          major="${GITHUB_REF_NAME#v}"
          major="${major%%.*}"
          if [ "$major" = "0" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: dist/*
